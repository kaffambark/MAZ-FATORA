<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>Facture</title>
  <style>
    * { box-sizing: border-box; }

    /* ---- Aperçu (écran) ---- */
    body {
      margin: 0;
      background: #e9edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      font-size: 12.5px;
    }

    .toolbar {
      position: sticky;
      top: 0;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 11px 18px;
      background: #0f172a;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .25);
      z-index: 10;
    }
    .toolbar button {
      font: inherit;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 9px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      cursor: pointer;
      transition: background .15s ease;
    }
    .toolbar button:hover { background: #334155; }
    .toolbar button.primary { background: #2563eb; border-color: #2563eb; }
    .toolbar button.primary:hover { background: #1d4ed8; }
    .toolbar .spacer { margin-right: auto; color: #94a3b8; font-size: 13px; align-self: center; font-weight: 700; }

    .sheet {
      position: relative;
      width: 210mm;
      min-height: 297mm;
      margin: 20px auto;
      background: #fff;
      padding: 16mm 15mm 18mm;
      box-shadow: 0 6px 30px rgba(0, 0, 0, .2);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    /* Bandeau de signature en tête de document */
    .sheet::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 70%, #60a5fa 100%);
    }

    /* ---- En-tête : société (gauche) / titre + méta (droite) ---- */
    .head { display: flex; justify-content: space-between; gap: 28px; margin-bottom: 24px; }
    .company { font-size: 12.5px; line-height: 1.5; }
    .company .logo { display: block; max-height: 72px; max-width: 220px; object-fit: contain; margin-bottom: 9px; }
    .company .cname { font-size: 19px; font-weight: 800; letter-spacing: -.2px; margin-bottom: 5px; }
    .company .cmeta { color: #475569; }
    .company .cmeta.id { color: #0f172a; font-weight: 600; }

    .title { text-align: right; }
    .title h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 4px;
      font-weight: 900;
      color: #0f172a;
      border-bottom: 3px solid #2563eb;
      padding-bottom: 6px;
      display: inline-block;
    }
    .title .title-ar { font-size: 24px; font-weight: 700; line-height: 1.2; }
    .title .num { font-size: 15px; font-weight: 700; color: #2563eb; margin-top: 6px; }

    /* Libellés bilingues (arabe + français) */
    .ar { font-family: "Geeza Pro", "Noto Naskh Arabic", "Traditional Arabic", "Times New Roman", serif; }
    [dir="rtl"] { unicode-bidi: isolate; }
    .lbl .ar { text-transform: none; letter-spacing: normal; font-size: 12px; }
    .lbl .fr { font-weight: 700; }

    /* Boîte méta (n°, date, échéance) encadrée */
    table.meta {
      margin-left: auto;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      background: #f8fafc;
    }
    table.meta td { padding: 5px 10px 5px 12px; white-space: nowrap; }
    table.meta td.ar { font-size: 12.5px; }
    table.meta td.fr { color: #475569; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
    table.meta td.v { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

    th.bi { padding-top: 7px; padding-bottom: 7px; }
    th.bi .ar {
      display: block;
      font-size: 10.5px;
      letter-spacing: normal;
      text-transform: none;
      font-weight: 600;
      opacity: .9;
    }
    th.bi .fr { display: block; font-size: 10px; }

    /* ---- Bloc client ---- */
    .parties { display: flex; justify-content: space-between; gap: 28px; margin-bottom: 22px; }
    .client-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-inline-start: 4px solid #2563eb;
      border-radius: 10px;
      padding: 12px 14px;
      min-width: 250px;
      line-height: 1.55;
    }
    .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #2563eb; font-weight: 800; margin-bottom: 6px; }
    .client-box .cname { font-weight: 700; font-size: 14px; }
    .client-box .cmeta { color: #475569; }

    /* ---- Lignes ---- */
    table.lines { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    table.lines th {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      color: #fff;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 8px 10px;
      text-align: left;
      border-bottom: 3px solid #2563eb;
    }
    table.lines th.num, table.lines td.num { text-align: right; }
    table.lines td { padding: 9px 10px; border-bottom: 1px solid #e2e8f0; }
    table.lines tr:nth-child(even) td { background: #f8fafc; }
    table.lines tbody tr:last-child td { border-bottom: 2px solid #0f172a; }
    td.num, th.num { font-variant-numeric: tabular-nums; }

    /* ---- Bas de page : notes + totaux ---- */
    .bottom { display: flex; justify-content: space-between; gap: 28px; margin-top: 12px; }
    .notes { flex: 1; color: #475569; line-height: 1.55; font-size: 11.5px; }

    /* Montant en toutes lettres */
    .words {
      margin-top: 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-inline-start: 3px solid #94a3b8;
      border-radius: 8px;
      padding: 10px 12px;
      color: #334155;
      line-height: 1.6;
    }
    .words .ar-line { font-size: 13.5px; margin-top: 6px; }
    .words .fr-line { font-size: 12.5px; margin-top: 2px; }
    .regime { margin-top: 10px; font-size: 11px; color: #475569; }
    .regime .ar { font-size: 12px; }

    .notes .mentions { margin-top: 12px; font-size: 10.5px; color: #64748b; }

    .totals {
      min-width: 255px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      overflow: hidden;
      background: #f8fafc;
      padding: 6px 0;
      align-self: flex-start;
    }
    .totals .row { display: flex; justify-content: space-between; padding: 7px 12px; font-size: 12.5px; }
    .totals .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
    .totals .row .tl span { display: block; }
    .totals .row .tl .ar { font-size: 12.5px; }
    .totals .row .tl .fr { font-size: 11px; opacity: .85; }
    .totals .row.grand {
      background: linear-gradient(180deg, #1e293b, #0f172a);
      color: #fff;
      padding: 11px 12px;
      margin-top: 6px;
      font-size: 16px;
      font-weight: 800;
      border-top: 3px solid #2563eb;
    }
    .totals .row.grand .tl .fr { opacity: .9; }

    /* ---- Tampon « PAYÉE » diagonal, par-dessus le document ---- */
    /* ---- Bandeau « acquitté » sous les totaux (filigrane lisible) ---- */
    /* Dans le flux du document : n'apparaît que sous les totaux, ne recouvre
       JAMAIS les lignes de la facture. Fond très léger + bordure épaisse et
       texte gras : lisible à l'écran, en impression et en noir & blanc. */
    .badge-paid {
      display: block;
      width: fit-content;
      margin: 4mm auto 3mm;
      background: linear-gradient(180deg, rgba(220, 252, 231, .16), rgba(220, 252, 231, .55));
      border: 2.5px solid #15803d;
      color: #15803d;
      font-weight: 900;
      font-size: 17px;
      letter-spacing: 2.5px;
      padding: 5px 22px;
      border-radius: 10px;
      transform: rotate(-3deg);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .badge-paid .ar { font-weight: 700; font-size: 14px; }

    /* ---- Pied de facture : bande légale ---- */
    .footer {
      margin-top: 32px;
      padding-top: 12px;
      border-top: 3px double #94a3b8;
      color: #475569;
      font-size: 10.5px;
      line-height: 1.6;
      text-align: center;
    }
    .footer .ar { font-size: 11.5px; }

    @media print {
      body { background: #fff; }
      .toolbar { display: none !important; }
      .sheet { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 0; }
      @page { size: A4; margin: 12mm; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <span class="spacer" id="tb-title" data-i18n="main.winInvoice">Facture</span>
    <button id="btn-close" data-i18n="common.close">Fermer</button>
    <button id="btn-pdf" data-i18n="common.pdf">Enregistrer en PDF…</button>
    <button id="btn-print" class="primary" data-i18n="common.print">Imprimer</button>
  </div>
  <div id="root" data-i18n="common.loading">Chargement…</div>
  <script src="words.js"></script>
  <script src="i18n.js"></script>
  <script src="print-invoice.js"></script>
</body>
</html>
